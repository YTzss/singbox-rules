name: Build sing-box rule-sets
# Public repository: https://github.com/YTzss/singbox-rules

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "scripts/**"
      - ".github/workflows/build-rules.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: build-rules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest)"
          tag="$(jq -r '.tag_name' <<<"${release_json}")"
          version="${tag#v}"
          archive="sing-box-${version}-linux-amd64.tar.gz"
          asset_url="$(jq -r --arg name "${archive}" \
            '.assets[] | select(.name == $name) | .browser_download_url' \
            <<<"${release_json}")"
          test -n "${asset_url}"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --output "${RUNNER_TEMP}/${archive}" "${asset_url}"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          sudo install -m 0755 \
            "${RUNNER_TEMP}/sing-box-${version}-linux-amd64/sing-box" \
            /usr/local/bin/sing-box
          sing-box version

      - name: Validate and compile every source rule-set
        run: ./scripts/build.sh

      - name: Verify every source has a compiled artifact
        run: |
          for source_file in source/*.json; do
            name="$(basename "${source_file}" .json)"
            test -s "compiled/${name}.srs"
          done
          test -s compiled/proxy-services.srs

      - name: Commit changed binaries
        run: |
          git diff --check
          if git diff --quiet -- compiled; then
            echo "No compiled changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiled
          git commit -m "build: refresh compiled rule-sets"
          git push
